<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personal Portfolio</title>
<script>
try{var t=localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.dataset.theme=t}catch(e){document.documentElement.dataset.theme='light'}
</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;border-radius:0}
:root{--bg:#fff;--fg:#111;--bg2:#f6f6f6;--mut:#666;--bd:#d9d9d9;--blue:#4285F4;--red:#EA4335;--yel:#FBBC05;--grn:#34A853;--ease:cubic-bezier(.2,.7,.2,1);color-scheme:light}
:root[data-theme=dark]{--bg:#111;--fg:#fff;--bg2:#1b1b1b;--mut:#a0a0a0;--bd:#383838;color-scheme:dark}
html{scroll-behavior:auto}
body{background:var(--bg);color:var(--fg);font-family:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;line-height:1.55;overflow-x:hidden;min-height:100vh}
body.tt *{transition:background-color .25s,color .25s,border-color .25s,fill .25s,stroke .25s!important}
a{color:inherit;text-decoration:none}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* header */
header{position:sticky;top:0;z-index:20;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(16px,3vw,40px);background:var(--bg);border-bottom:1px solid var(--bd)}
.brand{font-weight:800;letter-spacing:-.01em;line-height:1.1;font-size:15px}
.brand small{display:block;font-weight:400;color:var(--mut);font-size:12px;letter-spacing:.02em}
.meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--mut)}
.meta i{display:inline-block;width:7px;height:7px}
.tgl{width:40px;height:40px;border:1px solid var(--bd);background:var(--bg);cursor:pointer;display:grid;place-items:center;transition:background .2s,color .2s,border-color .2s}
.tgl:hover{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tgl svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}
.tgl .moon{display:none}:root[data-theme=dark] .tgl .moon{display:block}:root[data-theme=dark] .tgl .sun{display:none}
/* views */
.view{opacity:1}
.page{max-width:1200px;margin:0 auto;padding:32px clamp(16px,3vw,40px) 96px}
.back{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--bd);padding:10px 16px;font-size:13px;font-weight:700;letter-spacing:.04em;background:var(--bg);cursor:pointer;transition:background .2s,color .2s,border-color .2s}
.back span{transition:transform .2s}.back:hover{background:var(--fg);color:var(--bg);border-color:var(--fg)}.back:hover span{transform:translateX(-4px)}
.ph1{display:grid;grid-template-columns:1fr auto;align-items:end;gap:16px;margin:48px 0 40px;padding-bottom:24px;border-bottom:1px solid var(--fg)}
h1.t{font-size:clamp(44px,9vw,128px);line-height:.92;letter-spacing:-.04em;font-weight:800}
.ph1 p{color:var(--mut);font-size:13px;text-align:right;max-width:220px}
h2{font-size:13px;font-weight:700;letter-spacing:.04em;margin-bottom:16px;display:flex;align-items:center;gap:10px}
h2::before{content:"";width:8px;height:8px;background:var(--ac,var(--fg))}
.box{border:1px solid var(--bd);background:var(--bg);padding:24px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.lead{font-size:clamp(22px,2.6vw,34px);line-height:1.2;letter-spacing:-.02em;font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{border:1px solid var(--bd);padding:4px 10px;font-size:12px;color:var(--mut)}
.row{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-top:1px solid var(--bd);font-size:14px}
.row:first-of-type{border-top:0}
.row b{font-weight:700}.row span{color:var(--mut)}
.stack>*+*{margin-top:24px}
.note{font-size:11px;color:var(--mut);border:1px dashed var(--bd);padding:2px 8px;display:inline-block}
.arrow{display:inline-block;transition:transform .2s var(--ease)}
.rv{opacity:0;transform:translateY(14px);transition:opacity .5s var(--ease),transform .5s var(--ease)}
.rv.in{opacity:1;transform:none}
/* hub */
.hub{position:relative;height:calc(100svh - 64px);min-height:640px;max-width:1280px;margin:0 auto}
.hub svg.lines{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.ln{fill:none;stroke:var(--mut);stroke-width:1;transition:stroke .2s}
.ln.on{stroke:var(--ac);stroke-width:1.6}
.dot{fill:var(--bg);stroke:var(--mut);stroke-width:1;transition:stroke .2s,fill .2s}
.dot.on{stroke:var(--ac);fill:var(--ac)}
.ring{fill:none;stroke:var(--bd);stroke-width:1;stroke-dasharray:3 7}
.char{position:absolute;left:50%;top:52%;height:44%;transform:translate(-50%,-50%);aspect-ratio:314/422}
.char img{display:block;height:100%;width:auto;user-select:none}
.char::after{content:"";position:absolute;left:8%;right:8%;bottom:-2px;height:1px;background:var(--fg);opacity:.0}
.node{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:12px;padding:12px 16px;border:1px solid var(--bd);border-left:3px solid var(--ac);background:var(--bg);font-size:13px;font-weight:800;letter-spacing:.05em;white-space:nowrap;cursor:pointer;transition:background .2s,color .2s,border-color .2s}
.node .n{font-size:11px;font-weight:400;color:var(--mut);transition:color .2s}
.node svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:square}
.node .arrow{margin-left:6px;font-weight:400}
.node:hover,.node:focus-visible{background:var(--fg);color:var(--bg);border-color:var(--fg);border-left-color:var(--ac)}
.node:hover .n{color:var(--bg)}.node:hover .arrow{transform:translate(4px,-4px)}
.hubmeta{position:absolute;left:clamp(16px,3vw,40px);bottom:20px;font-size:12px;color:var(--mut);line-height:1.5}
.hubmeta b{display:block;color:var(--fg);font-size:clamp(22px,2.4vw,32px);letter-spacing:-.03em;line-height:1}
/* projects */
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:24px}
.card{border:1px solid var(--bd);background:var(--bg);display:flex;flex-direction:column;transition:border-color .2s}
.card:hover{border-color:var(--ac,var(--fg))}
.thumb{aspect-ratio:4/3;overflow:hidden;border-bottom:1px solid var(--bd);background:var(--bg2);position:relative}
.thumb svg{width:100%;height:100%;display:block;transition:transform .5s var(--ease)}
.card:hover .thumb svg{transform:scale(1.05)}
.cb{padding:20px;display:flex;flex-direction:column;gap:12px;flex:1}
.ct{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}
.card h3{font-size:22px;letter-spacing:-.02em;line-height:1.1;display:flex;justify-content:space-between;gap:12px;background:linear-gradient(var(--ac,var(--fg)),var(--ac,var(--fg))) 0 100%/0 2px no-repeat;transition:background-size .3s var(--ease);align-self:flex-start}
.card:hover h3{background-size:100% 2px}
.card p{font-size:14px;color:var(--mut)}
.links{display:flex;gap:8px;margin-top:auto;padding-top:8px}
.btn{border:1px solid var(--fg);padding:8px 14px;font-size:12px;font-weight:700;letter-spacing:.04em;background:var(--bg);cursor:pointer;display:inline-flex;gap:8px;transition:background .2s,color .2s}
a.btn:hover,button.btn:hover{background:var(--fg);color:var(--bg)}
a.btn:hover .arrow{transform:translate(3px,-3px)}
.btn.off{border-style:dashed;border-color:var(--bd);color:var(--mut);cursor:default}
/* timeline */
.tl{position:relative;padding-left:32px}
.tl::before{content:"";position:absolute;left:5px;top:6px;bottom:0;width:1px;background:var(--bd)}
.ti{position:relative;display:grid;grid-template-columns:160px 1fr;gap:24px;margin-bottom:32px}
.ti::before{content:"";position:absolute;left:-32px;top:8px;width:11px;height:11px;background:var(--bg);border:1px solid var(--fg);transition:background .2s}
.ti:hover::before{background:var(--ac)}
.yr{font-size:clamp(28px,3.4vw,44px);font-weight:800;letter-spacing:-.03em;line-height:1}
.ti .box h3{font-size:20px;letter-spacing:-.01em;line-height:1.2}.ti .box h4{font-size:13px;color:var(--mut);font-weight:400;margin:2px 0 12px}
.ti ul{margin:12px 0 14px 18px;font-size:14px;color:var(--mut)}
/* hobbies */
.hg{display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:minmax(180px,auto);gap:16px}
.hc{border:1px solid var(--bd);padding:20px;display:flex;flex-direction:column;justify-content:space-between;background:var(--bg);transition:background .25s,color .25s,border-color .25s;position:relative;overflow:hidden}
.hc:nth-child(1){grid-column:span 3;grid-row:span 2}.hc:nth-child(2){grid-column:span 3}.hc:nth-child(3){grid-column:span 2}.hc:nth-child(4){grid-column:span 1}.hc:nth-child(5){grid-column:span 2}.hc:nth-child(6){grid-column:span 4}
.hc:hover{background:var(--fg);color:var(--bg);border-color:var(--ac)}
.hc:hover p{color:var(--bg);opacity:.75}
.hc h3{font-size:clamp(22px,2.4vw,34px);letter-spacing:-.03em;line-height:1}
.hc p{font-size:14px;color:var(--mut)}
.hc svg{width:64px;height:64px;stroke:var(--ac);fill:none;stroke-width:1.5;transition:transform .4s var(--ease)}
.hc:hover svg{transform:rotate(90deg)}
/* gallery */
.flt{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.flt button{border:1px solid var(--bd);background:var(--bg);padding:8px 14px;font-size:12px;font-weight:700;letter-spacing:.04em;cursor:pointer;transition:background .2s,color .2s}
.flt button:hover{border-color:var(--fg)}.flt button[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:16px}
.gi{border:1px solid var(--bd);background:none;padding:0;cursor:zoom-in;text-align:left;overflow:hidden;transition:border-color .2s;display:block}
.gi:hover{border-color:var(--ac)}
.gi .thumb{border:0;border-bottom:1px solid var(--bd)}.gi:hover .thumb svg{transform:scale(1.06)}
.gi div.cap{padding:10px 12px;font-size:12px;display:flex;justify-content:space-between;color:var(--mut)}
#lb{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;padding:16px}
#lb .in{background:var(--bg);border:1px solid var(--fg);width:min(100%,860px);max-height:100%;overflow:auto}
#lb .thumb{aspect-ratio:4/3;max-height:70vh;border-bottom:1px solid var(--bd)}
#lb .bar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px;font-size:13px}
#lb .bar div{display:flex;gap:8px}
/* contact */
.big{font-size:clamp(20px,2.4vw,32px);font-weight:700;letter-spacing:-.02em;line-height:1.1;display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-top:1px solid var(--bd);background:linear-gradient(var(--ac),var(--ac)) 0 100%/0 2px no-repeat;transition:background-size .3s var(--ease)}
a.big:hover{background-size:100% 2px}a.big:hover .arrow{transform:translate(6px,-6px)}
.big.off{color:var(--mut);cursor:default}.big small{font-size:12px;font-weight:400}
label{display:block;font-size:12px;font-weight:700;letter-spacing:.04em;margin-bottom:6px}
input,textarea{width:100%;border:1px solid var(--bd);background:var(--bg);padding:12px;margin-bottom:4px;transition:border-color .2s}
input:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:inset 0 -2px 0 var(--blue)}
textarea{min-height:140px;resize:vertical}
.err{color:var(--red);font-size:12px;min-height:18px;margin-bottom:10px}
#st{margin-top:16px;font-size:13px;color:var(--mut)}
@media (max-width:1000px){.node{padding:10px 12px;font-size:12px;gap:8px}.node .n{display:none}}
@media (max-width:760px){
.meta span{display:none}
.hub{height:auto;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:16px}
.hub svg.lines,.hubmeta{display:none}
.char{position:static;transform:none;grid-column:1/-1;height:auto;width:min(70vw,300px);margin:0 auto 16px;aspect-ratio:314/422}
.char img{width:100%;height:auto}
.node{position:static!important;transform:none;white-space:normal;padding:16px 12px;min-height:56px}
.node .arrow{display:none}
.grid2,.ti{grid-template-columns:1fr}
.ph1{grid-template-columns:1fr}.ph1 p{text-align:left}
.hg{grid-template-columns:1fr 1fr}.hc:nth-child(n){grid-column:span 1;grid-row:auto}.hc:nth-child(1),.hc:nth-child(6){grid-column:span 2}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}.rv{opacity:1;transform:none}}
</style>
</head>
<body>
<header>
  <a class="brand" href="#/" id="brand"></a>
  <div class="meta"><span>PORTFOLIO / 2026</span><i style="background:var(--blue)"></i><i style="background:var(--red)"></i><i style="background:var(--yel)"></i><i style="background:var(--grn)"></i></div>
  <button class="tgl" id="tgl" aria-label="Ganti tema terang/gelap">
    <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>
    <svg class="moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
  </button>
</header>
<main id="app"></main>
<div id="lb" hidden role="dialog" aria-modal="true" aria-label="Lightbox galeri"><div class="in"><div class="thumb" id="lbimg"></div><div class="bar"><span id="lbcap"></span><div><button class="btn" id="lbp" aria-label="Sebelumnya">&larr; PREV</button><button class="btn" id="lbn" aria-label="Berikutnya">NEXT &rarr;</button><button class="btn" id="lbc" aria-label="Tutup">CLOSE</button></div></div></div></div>

<script>
/* ===== EDITABLE DATA — ganti semua placeholder di sini ===== */
const portfolioData = {
  name: "NAMA ANDA",
  role: "Creative Developer",
  bio: "Ganti teks ini dengan perkenalan singkat tentang diri Anda. Ceritakan apa yang Anda bangun, mengapa, dan untuk siapa.",
  lead: "Saya membangun antarmuka web yang tajam, cepat, dan mudah dipakai.",
  skills: [["Frontend Development","Lanjutan"],["UI / Motion Design","Menengah"],["Problem Solving","Lanjutan"]],
  stack: ["HTML","CSS","JavaScript","Git","Figma","Node.js"],
  interests: ["Game","Desain antarmuka","Open source"],
  projects: [
    {title:"Project Satu",desc:"Deskripsi singkat project. Ganti dengan penjelasan nyata.",tech:["HTML","CSS","JS"],cat:"Web",year:"2026",github:"",demo:""},
    {title:"Project Dua",desc:"Deskripsi singkat project. Ganti dengan penjelasan nyata.",tech:["JavaScript","API"],cat:"Aplikasi",year:"2025",github:"",demo:""},
    {title:"Project Tiga",desc:"Deskripsi singkat project. Ganti dengan penjelasan nyata.",tech:["Node.js"],cat:"Tools",year:"2025",github:"",demo:""}
  ],
  experience: [
    {pos:"Posisi / Jabatan",org:"Nama Perusahaan atau Organisasi",year:"2025–Sekarang",desc:"Ringkasan peran Anda.",tasks:["Tanggung jawab pertama","Tanggung jawab kedua"],tech:["JavaScript","Git"]},
    {pos:"Posisi Sebelumnya",org:"Nama Organisasi",year:"2023–2025",desc:"Ringkasan peran Anda.",tasks:["Tanggung jawab pertama","Tanggung jawab kedua"],tech:["HTML","CSS"]}
  ],
  education: [
    {inst:"Nama Universitas / Sekolah",major:"Jurusan",year:"2022–2026",activities:"Organisasi atau kegiatan",achievements:"Penghargaan atau prestasi",certs:["Sertifikasi contoh"]},
    {inst:"Nama SMA / SMK",major:"Jurusan",year:"2019–2022",activities:"Ekstrakurikuler",achievements:"Prestasi",certs:[]}
  ],
  hobbies: [
    {t:"Gaming",d:"Ceritakan game favorit dan alasannya."},{t:"Coding",d:"Proyek sampingan di akhir pekan."},{t:"Musik",d:"Genre atau artis."},{t:"Foto",d:"Subjek."},{t:"Desain",d:"Poster, UI, dan eksperimen."},{t:"Hobi lain",d:"Tambahkan hobi Anda di sini."}
  ],
  gallery: [
    {t:"Foto 1",c:"Karya"},{t:"Foto 2",c:"Karya"},{t:"Foto 3",c:"Kegiatan"},{t:"Foto 4",c:"Kegiatan"},{t:"Foto 5",c:"Setup"},{t:"Foto 6",c:"Setup"}
  ],
  social: {github:"",linkedin:"",instagram:"",email:""}
};
const D = portfolioData;
const ACC = ["--blue","--red","--yel","--grn"];
const ICON = {
  about:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>',
  projects:'<path d="M8 7l-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/>',
  experience:'<path d="M3 8h18v12H3zM8 8V4h8v4M3 13h18"/>',
  education:'<path d="M2 9l10-5 10 5-10 5zM6 11v5c3 2.5 9 2.5 12 0v-5"/>',
  hobbies:'<path d="M6 8h12a4 4 0 0 1 4 4l-1 5a2 2 0 0 1-3.5 1L16 16H8l-1.5 2A2 2 0 0 1 3 17l-1-5a4 4 0 0 1 4-4zM8 10v4M6 12h4M16 11h.01M18 13h.01"/>',
  gallery:'<path d="M3 4h18v16H3zM3 16l5-5 5 5 3-3 5 5M15 9h.01"/>',
  contact:'<path d="M3 5h18v14H3zM3 6l9 7 9-7"/>'
};
const MENU = [
  {id:"about",label:"ABOUT ME",x:50,y:9},
  {id:"hobbies",label:"HOBBIES",x:76,y:24},
  {id:"gallery",label:"GALLERY",x:83,y:47},
  {id:"education",label:"EDUCATION",x:76,y:80},
  {id:"contact",label:"CONTACT",x:37,y:90},
  {id:"experience",label:"EXPERIENCE",x:16,y:64},
  {id:"projects",label:"PROJECTS",x:19,y:27}
];
const TITLES = {about:"About Me",projects:"Projects",experience:"Experience",education:"Education",hobbies:"Hobbies",gallery:"Gallery",contact:"Contact"};
const e = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
const dur = n => reduce ? 0 : n;
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];

/* ===== placeholder visuals (HTML/SVG, diberi label jelas) ===== */
function ph(i,label){
  const a=ACC[i%4], k=i%4;
  let g='';
  if(k===0) g='<circle cx="200" cy="130" r="70" fill="none" stroke="var(--fg)" stroke-width="2"/><rect x="170" y="100" width="60" height="60" fill="var(--'+a.slice(2)+')"/>';
  if(k===1) g='<path d="M0 300L400 0M60 300L400 40M120 300L400 80M180 300L400 120" stroke="var(--fg)" stroke-width="1.5"/><rect x="40" y="40" width="70" height="70" fill="var(--'+a.slice(2)+')"/>';
  if(k===2) g='<g fill="none" stroke="var(--fg)" stroke-width="1.5"><rect x="60" y="50" width="120" height="120"/><rect x="140" y="90" width="120" height="120"/><rect x="220" y="130" width="120" height="120" fill="var(--'+a.slice(2)+')"/></g>';
  if(k===3) g='<g fill="var(--fg)"><rect x="50" y="150" width="50" height="100"/><rect x="120" y="100" width="50" height="150"/><rect x="190" y="60" width="50" height="190"/></g><rect x="260" y="60" width="50" height="190" fill="var(--'+a.slice(2)+')"/>';
  return '<svg viewBox="0 0 400 300" role="img" aria-label="'+e(label)+' (placeholder)" preserveAspectRatio="xMidYMid slice"><rect width="400" height="300" fill="var(--bg2)"/>'+g+'<text x="14" y="288" font-size="11" fill="var(--mut)" font-family="Arial">PLACEHOLDER — '+e(label)+'</text></svg>';
}
const lk = (url,label)=> url ? '<a class="btn" href="'+e(url)+'" target="_blank" rel="noopener">'+label+' <span class="arrow">&nearr;</span></a>' : '<span class="btn off" title="URL belum diisi (placeholder)">'+label+' (placeholder)</span>';

/* ===== view templates ===== */
const VIEWS = {
about:()=>`<div class="grid2">
  <div class="stack"><p class="lead">${e(D.lead)}</p><p style="color:var(--mut);max-width:60ch">${e(D.bio)}</p>
  <div><h2 style="--ac:var(--blue)">Interests</h2><div class="tags">${D.interests.map(i=>'<span class="tag">'+e(i)+'</span>').join('')}</div></div></div>
  <div class="stack">
  <div class="box rv"><h2 style="--ac:var(--red)">Skills</h2>${D.skills.map(s=>'<div class="row"><b>'+e(s[0])+'</b><span>'+e(s[1])+'</span></div>').join('')}</div>
  <div class="box rv"><h2 style="--ac:var(--grn)">Tech stack</h2><div class="tags">${D.stack.map(i=>'<span class="tag">'+e(i)+'</span>').join('')}</div></div></div></div>`,
projects:()=>`<div class="pg">${D.projects.map((p,i)=>`<article class="card rv" style="--ac:var(${ACC[i%4]})"><div class="thumb">${ph(i,p.title)}</div><div class="cb">
  <div class="ct"><span>No. ${String(i+1).padStart(2,'0')} · ${e(p.cat)}</span><span>${e(p.year)}</span></div>
  <h3>${e(p.title)} <span class="arrow">&nearr;</span></h3><p>${e(p.desc)}</p>
  <div class="tags">${p.tech.map(t=>'<span class="tag">'+e(t)+'</span>').join('')}</div>
  <div class="links">${lk(p.github,'GitHub')}${lk(p.demo,'Live Demo')}</div></div></article>`).join('')}</div>`,
experience:()=>`<div class="tl">${D.experience.map((x,i)=>`<div class="ti rv" style="--ac:var(${ACC[i%4]})"><div class="yr">${e(x.year)}</div><div class="box"><h3>${e(x.pos)}</h3><h4>${e(x.org)}</h4><p style="font-size:14px">${e(x.desc)}</p><ul>${x.tasks.map(t=>'<li>'+e(t)+'</li>').join('')}</ul><div class="tags">${x.tech.map(t=>'<span class="tag">'+e(t)+'</span>').join('')}</div></div></div>`).join('')}</div>`,
education:()=>`<div class="tl">${D.education.map((x,i)=>`<div class="ti rv" style="--ac:var(${ACC[i%4]})"><div class="yr">${e(x.year)}</div><div class="box"><h3>${e(x.inst)}</h3><h4>${e(x.major)}</h4>
  <div class="row"><b>Kegiatan</b><span>${e(x.activities)}</span></div><div class="row"><b>Prestasi</b><span>${e(x.achievements)}</span></div>
  ${x.certs.length?'<div class="tags" style="margin-top:12px">'+x.certs.map(t=>'<span class="tag">'+e(t)+'</span>').join('')+'</div>':''}</div></div>`).join('')}</div>`,
hobbies:()=>`<div class="hg">${D.hobbies.map((h,i)=>`<div class="hc rv" style="--ac:var(${ACC[i%4]})"><svg viewBox="0 0 64 64"><rect x="8" y="8" width="48" height="48"/><rect x="24" y="24" width="16" height="16"/></svg><div><h3>${e(h.t)}</h3><p>${e(h.d)}</p></div></div>`).join('')}</div>`,
gallery:()=>`<div class="flt" id="flt"></div><div class="gg" id="gg"></div>`,
contact:()=>{const s=D.social,row=(k,l,u,txt)=>u?'<a class="big" style="--ac:var('+ACC[k]+')" href="'+e(u)+'" '+(u.startsWith('mailto')?'':'target="_blank" rel="noopener"')+'><span>'+l+'</span><span class="arrow">&nearr;</span></a>':'<div class="big off"><span>'+l+'</span><small>belum diisi (placeholder)</small></div>';
 return `<div class="grid2"><div><p class="lead" style="margin-bottom:32px">Punya ide atau ingin berkolaborasi? Kirim pesan, saya akan membalas lewat email.</p>
 ${row(0,'Email',s.email&&'mailto:'+s.email)}${row(1,'GitHub',s.github)}${row(2,'LinkedIn',s.linkedin)}${row(3,'Instagram',s.instagram)}</div>
 <form class="box" id="cf" novalidate><label for="fn">NAMA</label><input id="fn" autocomplete="name"><div class="err" data-e="fn"></div>
 <label for="fe">EMAIL ANDA</label><input id="fe" type="email" autocomplete="email"><div class="err" data-e="fe"></div>
 <label for="fm">PESAN</label><textarea id="fm"></textarea><div class="err" data-e="fm"></div>
 <button class="btn" type="submit">BUKA APLIKASI EMAIL <span class="arrow">&rarr;</span></button><p id="st" role="status"></p></form></div>`}
};
const SUB = {about:"Tentang saya",projects:"Karya terpilih",experience:"Pengalaman kerja",education:"Perjalanan belajar",hobbies:"Di luar layar",gallery:"Dokumentasi visual",contact:"Mari bicara"};

/* ===== theme ===== */
function updateTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem('theme',t)}catch(_){}}
function initTheme(){
  $('#tgl').addEventListener('click',()=>{document.body.classList.add('tt');setTimeout(()=>document.body.classList.remove('tt'),320);updateTheme(document.documentElement.dataset.theme==='dark'?'light':'dark')});
}

/* ===== connection lines ===== */
function initConnectionLines(){
  const hub=$('#hub'),svg=$('#lines');if(!hub||hub.offsetParent===null)return;
  const H=hub.getBoundingClientRect();if(getComputedStyle(svg).display==='none')return;
  const ch=$('#char').getBoundingClientRect();
  const cx=ch.left-H.left+ch.width/2,cy=ch.top-H.top+ch.height/2,rx=ch.width*.78,ry=ch.height*.62;
  let out=`<ellipse class="ring" cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}"/>`;
  $$('.node',hub).forEach((n,i)=>{
    const r=n.getBoundingClientRect(),nx=r.left-H.left+r.width/2,ny=r.top-H.top+r.height/2;
    const dx=nx-cx,dy=ny-cy,len=Math.hypot(dx/rx,dy/ry),tx=cx+dx/len,ty=cy+dy/len;
    const vert=Math.abs(dy)/H.height>Math.abs(dx)/H.width*1.1;
    let ax,ay,d;
    if(vert){ax=nx;ay=ny+(dy>0?-r.height/2:r.height/2);const m=(ay+ty)/2;d=`M${ax} ${ay}C${ax} ${m} ${tx} ${m} ${tx} ${ty}`}
    else{ax=nx+(dx>0?-r.width/2:r.width/2);ay=ny;const m=(ax+tx)/2;d=`M${ax} ${ay}C${m} ${ay} ${m} ${ty} ${tx} ${ty}`}
    out+=`<g data-id="${n.dataset.id}" style="--ac:var(${ACC[i%4]})"><path class="ln" d="${d}" pathLength="1" stroke-dasharray="1"/><rect class="dot" x="${ax-3.5}" y="${ay-3.5}" width="7" height="7"/><rect class="dot" x="${tx-3.5}" y="${ty-3.5}" width="7" height="7"/></g>`;
  });
  svg.innerHTML=out;
  $$('.node',hub).forEach(n=>{
    const g=$('g[data-id="'+n.dataset.id+'"]',svg),t=on=>$$('.ln,.dot',g).forEach(x=>x.classList.toggle('on',on));
    ['mouseenter','focus'].forEach(ev=>n.addEventListener(ev,()=>t(true)));
    ['mouseleave','blur'].forEach(ev=>n.addEventListener(ev,()=>t(false)));
  });
}
function homeIntro(){
  const hub=$('#hub'),nodes=$$('.node',hub),ease='cubic-bezier(.2,.7,.2,1)';
  initConnectionLines();
  const ring=$('.ring',hub);
  $('#char').animate([{opacity:0},{opacity:1}],{duration:dur(600),easing:ease});
  $$('#lines .ln').forEach((p,i)=>p.animate([{strokeDashoffset:1},{strokeDashoffset:0}],{duration:dur(700),delay:dur(250+i*60),easing:ease,fill:'backwards'}));
  $$('#lines .dot,#lines .ring').forEach((p,i)=>p.animate([{opacity:0},{opacity:1}],{duration:dur(300),delay:dur(500+i*30),fill:'backwards'}));
  nodes.forEach((n,i)=>n.animate([{opacity:0,transform:(innerWidth>760?'translate(-50%,-50%) ':'')+'translateY(10px)'},{opacity:1,transform:(innerWidth>760?'translate(-50%,-50%) ':'')+'none'}],{duration:dur(400),delay:dur(500+i*70),easing:ease,fill:'backwards'}));
}

let cur=null,want=null,busy=false;
const routeOf=()=>{const h=(location.hash||'#/').replace(/^#\/?/,'').split(/[?/]/)[0];return h&&views[h]?h:'home'};
function navigateTo(v){const h=v==='home'?'#/':'#/'+v;if(location.hash===h)return;location.hash=h}
function renderView(name){
  document.title=(name==='home'?D.name:TITLES[name]+' — '+D.name)+' | Portfolio';
}
async function transitionView(from,to){
  const ease='cubic-bezier(.4,0,.2,1)';
  if(from){await from.animate([{opacity:1,transform:'none'},{opacity:0,transform:'translateY(-8px)'}],{duration:dur(260),easing:ease}).finished.catch(()=>{});from.hidden=true}
  to.hidden=false;window.scrollTo(0,0);
}
async function runRoute(){
  busy=true;
  while(want!==cur){
    const t=want,from=cur?views[cur]:null,to=views[t];
    await transitionView(from,to);cur=t;renderView(t);
    if(t==='home')homeIntro();
    else{
      to.animate([{opacity:0,transform:'translateY(14px)'},{opacity:1,transform:'none'}],{duration:dur(420),easing:'cubic-bezier(.2,.7,.2,1)'});
      const h=$('h1',to);h&&h.focus({preventScroll:true});
      $$('.rv',to).forEach(x=>x.classList.remove('in'));revealScan(to);
    }
  }
  busy=false;
}
function revealScan(root){
  const els=$$('.rv:not(.in)',root);
  if(!('IntersectionObserver' in window)||reduce){els.forEach(x=>x.classList.add('in'));return}
  const io=new IntersectionObserver((en)=>en.forEach(o=>{if(o.isIntersecting){setTimeout(()=>o.target.classList.add('in'),(o.target.dataset.d|0));io.unobserve(o.target)}}),{threshold:.08});
  els.forEach((x,i)=>{x.dataset.d=(i%4)*70;io.observe(x)});
}
function initNavigation(){
  addEventListener('hashchange',()=>{want=routeOf();if(!busy)runRoute()});
  addEventListener('resize',()=>{if(cur==='home'){initConnectionLines()}});
  want=routeOf();runRoute();
}

/* ===== gallery & lightbox ===== */
let gf='Semua',gl=[],gi=0,lastFocus=null;
function initGallery(){
  const cats=['Semua',...new Set(D.gallery.map(g=>g.c))];
  const f=$('#flt'),g=$('#gg');
  const draw=()=>{
    f.innerHTML=cats.map(c=>`<button type="button" aria-pressed="${c===gf}" data-c="${e(c)}">${e(c).toUpperCase()}</button>`).join('');
    gl=D.gallery.map((x,i)=>({...x,i})).filter(x=>gf==='Semua'||x.c===gf);
    g.innerHTML=gl.map((x,j)=>`<button type="button" class="gi" data-j="${j}" style="--ac:var(${ACC[x.i%4]})" aria-label="Buka ${e(x.t)}"><div class="thumb">${ph(x.i,x.t)}</div><div class="cap"><span>${e(x.t)}</span><span>${e(x.c)}</span></div></button>`).join('');
  };
  draw();
  f.addEventListener('click',ev=>{const b=ev.target.closest('button');if(b){gf=b.dataset.c;draw()}});
  g.addEventListener('click',ev=>{const b=ev.target.closest('.gi');if(b)openLb(+b.dataset.j,b)});
  $('#lbp').onclick=()=>stepLb(-1);$('#lbn').onclick=()=>stepLb(1);$('#lbc').onclick=closeLb;
  $('#lb').addEventListener('click',ev=>{if(ev.target.id==='lb')closeLb()});
  addEventListener('keydown',ev=>{
    if($('#lb').hidden)return;
    if(ev.key==='Escape')closeLb();else if(ev.key==='ArrowLeft')stepLb(-1);else if(ev.key==='ArrowRight')stepLb(1);
    else if(ev.key==='Tab'){const f=$$('#lb button');const a=f[0],z=f[f.length-1];if(ev.shiftKey&&document.activeElement===a){ev.preventDefault();z.focus()}else if(!ev.shiftKey&&document.activeElement===z){ev.preventDefault();a.focus()}}
  });
}
function showLb(){const x=gl[gi];$('#lbimg').innerHTML=ph(x.i,x.t);$('#lbcap').textContent=(gi+1)+' / '+gl.length+' — '+x.t}
function openLb(j,from){lastFocus=from;gi=j;showLb();$('#lb').hidden=false;document.body.style.overflow='hidden';$('#lbc').focus()}
function stepLb(d){gi=(gi+d+gl.length)%gl.length;showLb()}
function closeLb(){$('#lb').hidden=true;document.body.style.overflow='';lastFocus&&lastFocus.focus()}

/* ===== contact form (mailto, tidak mengirim apa pun otomatis) ===== */
function initContact(){
  const f=$('#cf');
  f.addEventListener('submit',ev=>{
    ev.preventDefault();
    const v={fn:$('#fn').value.trim(),fe:$('#fe').value.trim(),fm:$('#fm').value.trim()},er={};
    if(v.fn.length<2)er.fn='Isi nama minimal 2 karakter.';
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.fe))er.fe='Masukkan alamat email yang valid.';
    if(v.fm.length<10)er.fm='Pesan minimal 10 karakter.';
    $$('.err',f).forEach(x=>x.textContent=er[x.dataset.e]||'');
    const st=$('#st');
    const first=Object.keys(er)[0];if(first){$('#'+first).focus();st.textContent='';return}
    if(!D.social.email){st.textContent='Email tujuan belum diisi. Isi portfolioData.social.email di file ini.';return}
    const body=encodeURIComponent(v.fm+'\n\n— '+v.fn+' ('+v.fe+')');
    location.href='mailto:'+D.social.email+'?subject='+encodeURIComponent('Pesan dari portfolio: '+v.fn)+'&body='+body;
    st.textContent='Aplikasi email dibuka. Pesan baru terkirim setelah Anda menekan kirim di aplikasi email.';
  });
}

initTheme();buildViews();initNavigation();
